name: Ruff Job
on:
  pull_request
jobs:
  ruff_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: pip install ruff

      - name: Start ruff Check
        run: ruff check --show-fixes > results.txt
        continue-on-error: true

      - name: Log Results
        run: cat results.txt
